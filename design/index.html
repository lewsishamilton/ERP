<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 100%; min-width: 1200px; height: 100vh; position: relative; overflow: hidden; background: #F5F7FA">

<!-- ============ LOGIN ============ -->
<sc-if value="{{isLogin}}" hint-placeholder-val="{{true}}">
<div style="display: flex; width: 100%; height: 100vh">
<section style="flex-grow: 1; position: relative; overflow: hidden; background: #0D2D52; color: #FFFFFF; padding: 56px 80px; display: flex; flex-direction: column; justify-content: space-between">
<div aria-hidden="true" style="position: absolute; right: -60px; bottom: -48px; width: 540px; height: 466px; overflow: hidden; opacity: .07"><img src="logo-white.png" alt="" style="width: 1487px; height: auto; margin-left: -74px; margin-top: -28px; display: block"></div>
<img src="logo-white.png" alt="Arundathi Institute of Medical Sciences and Hospital" style="position: relative; width: 300px; height: auto; display: block; margin-left: -15px">
<div style="position: relative; max-width: 600px">
<div style="font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: #A9C0DA">Campus ERP · Academic Year 2026–27</div>
<h1 class="serif" style="margin: 20px 0 0; font-size: 72px; line-height: 1.02">The whole campus, <span style="font-style: italic; color: #A9C0DA">in one place.</span></h1>
<p style="margin: 24px 0 0; font-size: 17px; line-height: 1.65; max-width: 460px; color: #C9D6E6">Attendance, results, fees and notices for students. Attendance, marks and assignments for faculty. One portal, updated as it happens.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 56px; padding-top: 28px; border-top: 1px solid rgba(255,255,255,.14)">
<div><div style="font-size: 14px; font-weight: 600">Attendance</div><div style="margin-top: 4px; font-size: 13px; line-height: 1.5; color: #A9C0DA">Updated as soon as faculty submit it.</div></div>
<div><div style="font-size: 14px; font-weight: 600">Fees</div><div style="margin-top: 4px; font-size: 13px; line-height: 1.5; color: #A9C0DA">Pay online and download receipts.</div></div>
<div><div style="font-size: 14px; font-weight: 600">Faculty</div><div style="margin-top: 4px; font-size: 13px; line-height: 1.5; color: #A9C0DA">Ask questions, get replies here.</div></div>
</div>
</div>
<div style="position: relative; font-size: 12px; color: #A9C0DA">© 2026 · Student &amp; Faculty ERP</div>
</section>
<section style="width: 560px; flex-shrink: 0; background: #FFFFFF; border-left: 1px solid #E4E8EE; display: flex; align-items: center; justify-content: center">
<div style="width: 380px; display: flex; flex-direction: column; gap: 24px">
<div><h2 style="margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.02em">Sign in</h2><p class="sub" style="font-size: 14px">Choose your portal to continue.</p></div>
<div role="group" aria-label="Portal" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EFF2F6; border-radius: 9px">
<button type="button" class="seg" onClick="{{pickStudent}}" style="background: {{roleS.bg}}; color: {{roleS.fg}}; box-shadow: {{roleS.sh}}">Student</button>
<button type="button" class="seg" onClick="{{pickTeacher}}" style="background: {{roleT.bg}}; color: {{roleT.fg}}; box-shadow: {{roleT.sh}}">Faculty</button>
</div>
<div>
<label class="lbl" for="login-id">{{idLabel}}</label>
<input id="login-id" class="inp" value="{{loginId}}" onChange="{{onLoginId}}" onKeyDown="{{loginKey}}" placeholder="{{idPlaceholder}}" autocomplete="username">
<sc-if value="{{loginErr}}" hint-placeholder-val="{{false}}"><div style="margin-top: 8px; font-size: 13px; color: #B3261E">Enter your {{idLabel}} to continue.</div></sc-if>
</div>
<div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><label class="lbl" for="login-pw">Password</label><button type="button" class="linkbtn" onClick="{{forgot}}">Forgot password?</button></div>
<input id="login-pw" class="inp" type="password" placeholder="Password" autocomplete="current-password" onKeyDown="{{loginKey}}">
</div>
<button type="button" class="btn btn-p" style="width: 100%; min-height: 48px" onClick="{{signIn}}">Sign in to {{portalName}}</button>
<p class="sub" style="margin: 0; text-align: center">Prototype: any ID signs you in.</p>
</div>
</section>
</div>
</sc-if>

<!-- ============ STUDENT PORTAL ============ -->
<sc-if value="{{isStudent}}" hint-placeholder-val="{{false}}">
<div style="display: flex; width: 100%; height: 100vh">
<aside style="width: 248px; flex-shrink: 0; background: #FFFFFF; border-right: 1px solid #E4E8EE; display: flex; flex-direction: column; gap: 2px; padding: 24px 16px">
<div style="padding: 4px 8px 22px; margin-bottom: 14px; border-bottom: 1px solid #EEF1F5">
<img src="logo.png" alt="Arundathi Institute of Medical Sciences and Hospital" style="width: 188px; height: auto; display: block; margin-left: -9px">
<span class="pill" style="margin-top: 14px; background: #EEF3F8; color: #0D2D52">Student portal</span>
</div>
<div class="eyebrow" style="padding: 2px 12px 8px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase">Menu</div>
<button type="button" class="nav" onClick="{{sn.home.go}}" style="background: {{sn.home.bg}}; color: {{sn.home.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"></path><path d="M5 10v10h14V10"></path></svg><span style="flex-grow: 1">Dashboard</span></button>
<button type="button" class="nav" onClick="{{sn.basic.go}}" style="background: {{sn.basic.bg}}; color: {{sn.basic.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg><span style="flex-grow: 1">Basic Information</span></button>
<button type="button" class="nav" onClick="{{sn.academic.go}}" style="background: {{sn.academic.bg}}; color: {{sn.academic.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"></path><path d="M9 7h7"></path></svg><span style="flex-grow: 1">Academic Information</span></button>
<button type="button" class="nav" onClick="{{sn.exams.go}}" style="background: {{sn.exams.bg}}; color: {{sn.exams.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg><span style="flex-grow: 1">Exam Time Tables</span></button>
<button type="button" class="nav" onClick="{{sn.fees.go}}" style="background: {{sn.fees.bg}}; color: {{sn.fees.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20M6 15h4"></path></svg><span style="flex-grow: 1">Online Fee Payments</span></button>
<button type="button" class="nav" onClick="{{sn.marks.go}}" style="background: {{sn.marks.bg}}; color: {{sn.marks.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg><span style="flex-grow: 1">Marks Details</span></button>
<button type="button" class="nav" onClick="{{sn.downloads.go}}" style="background: {{sn.downloads.bg}}; color: {{sn.downloads.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"></path></svg><span style="flex-grow: 1">Downloads</span></button>
<button type="button" class="nav" onClick="{{sn.ask.go}}" style="background: {{sn.ask.bg}}; color: {{sn.ask.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H9l-5 4z"></path></svg><span style="flex-grow: 1">Ask Faculty</span><sc-if value="{{hasNewReplies}}" hint-placeholder-val="{{false}}"><span class="pill" style="background: #0D2D52; color: #FFFFFF; height: 20px; padding: 0 7px">{{newReplies}}</span></sc-if></button>
<button type="button" class="nav" onClick="{{sn.contact.go}}" style="background: {{sn.contact.bg}}; color: {{sn.contact.fg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A17 17 0 0 1 3 5a2 2 0 0 1 2-2z"></path></svg><span style="flex-grow: 1">Contact Us</span></button>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: center; gap: 12px; padding: 16px 8px; border-top: 1px solid #EEF1F5">
<div style="width: 36px; height: 36px; border-radius: 50%; background: #EFF2F6; color: #5A606B; display: grid; place-items: center; flex-shrink: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
<div style="min-width: 0"><div style="font-size: 14px; font-weight: 500">[Student Name]</div><div class="eyebrow">[Roll No.] · CSE</div></div>
</div>
<button type="button" class="nav" onClick="{{logout}}" style="background: transparent; color: #5A606B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H5v16h4M14 8l4 4-4 4M18 12H9"></path></svg><span style="flex-grow: 1">Log out</span></button>
</aside>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column">
<header style="height: 72px; flex-shrink: 0; border-bottom: 1px solid #E4E8EE; display: flex; align-items: center; gap: 12px; padding: 0 48px">
<h1 style="flex-grow: 1; margin: 0; font-size: 18px; font-weight: 600">{{sTitle}}</h1>
<span class="eyebrow" style="margin-right: 8px">AY 2026–27 · II Year, I Sem</span>
<button type="button" class="btn" onClick="{{toTeacher}}">Switch to faculty view</button>
<button type="button" class="icon-btn" aria-label="Notifications" onClick="{{sn.home.go}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><sc-if value="{{hasNewNotices}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 10px; right: 11px; width: 8px; height: 8px; border-radius: 50%; background: #0D2D52; border: 2px solid #FFFFFF"></span></sc-if></button>
</header>
<main class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 40px 48px 64px">

<!-- Student: Dashboard -->
<sc-if value="{{ss.home}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 40px">
<div class="hero">
<div aria-hidden="true" style="position: absolute; right: 40px; top: -36px; width: 300px; height: 259px; overflow: hidden; opacity: .09"><img src="logo.png" alt="" style="width: 826px; height: auto; margin-left: -41px; margin-top: -15px; display: block"></div>
<div style="position: relative">
<div class="eyebrow" style="color: #3E5F85">{{todayLong}}</div>
<h2 class="serif" style="margin: 8px 0 0; font-size: 46px; line-height: 1.1; color: #0D2D52">{{greeting}}, [Student Name]</h2>
<p style="margin: 8px 0 0; font-size: 15px; color: #3E5F85">B.Tech Computer Science &amp; Engineering · II Year, I Semester · Section A</p>
<div style="display: flex; gap: 10px; margin-top: 24px"><button type="button" class="btn btn-p" onClick="{{sn.fees.go}}">Pay fees</button><button type="button" class="btn" onClick="{{goTimetable}}">View timetable</button></div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
<div class="card stat"><span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span><div class="eyebrow">Overall attendance</div><div class="num">{{overall}}%</div><div class="bar" style="margin-top: 12px"><div style="height: 6px; width: {{overall}}%; background: #0D2D52; border-radius: 999px"></div></div><div class="sub" style="margin-top: 8px">Minimum 75% required</div></div>
<div class="card stat"><span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"></path></svg></span><div class="eyebrow">CGPA</div><div class="num">{{cgpa}}</div><div class="sub">After 2 semesters</div></div>
<div class="card stat"><span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg></span><div class="eyebrow">Fee due</div><div class="num">{{feeDue}}</div><div class="sub">{{feeDueNote}}</div></div>
<div class="card stat"><span class="chip"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 4h6v3H9zM9 12h6M9 16h4"></path></svg></span><div class="eyebrow">Assignments pending</div><div class="num">{{pendingCount}}</div><div class="sub">{{nextDueNote}}</div></div>
</div>
<div style="display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; align-items: start">
<div class="card" style="overflow: hidden">
<div style="padding: 24px 28px 20px"><h2 class="h2">Notifications</h2><p class="sub">From the college offices and your faculty</p></div>
<div class="th" style="display: grid; grid-template-columns: 88px minmax(0, 1fr)"><div>Date</div><div>Notice</div></div>
<sc-for list="{{notices}}" as="n" hint-placeholder-count="6">
<div class="tr" style="display: grid; grid-template-columns: 88px minmax(0, 1fr)">
<div class="muted" style="font-size: 13px">{{n.date}}</div>
<div>
<div style="display: flex; gap: 10px; align-items: flex-start"><span style="flex-grow: 1">{{n.msg}}</span><sc-if value="{{n.isNew}}" hint-placeholder-val="{{false}}"><span class="pill" style="background: #EEF3F8; color: #0D2D52">New</span></sc-if></div>
<div class="eyebrow" style="margin-top: 4px">{{n.no}} · {{n.by}}</div>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 32px">
<div class="card" style="padding: 24px 28px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Today’s classes</h2><button type="button" class="linkbtn" onClick="{{goTimetable}}">Timetable</button></div>
<sc-if value="{{noClasses}}" hint-placeholder-val="{{false}}"><p class="sub" style="margin-top: 16px">No classes scheduled today.</p></sc-if>
<div style="display: flex; flex-direction: column; margin-top: 12px">
<sc-for list="{{todayClasses}}" as="c" hint-placeholder-count="5">
<div style="display: flex; gap: 16px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid #EEF1F5">
<div class="muted" style="width: 104px; flex-shrink: 0; font-size: 13px">{{c.time}}</div>
<div style="font-size: 14px">{{c.name}}</div>
</div>
</sc-for>
</div>
</div>
<div class="card" style="padding: 24px 28px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Due soon</h2><button type="button" class="linkbtn" onClick="{{goAssignments}}">All assignments</button></div>
<sc-if value="{{noPending}}" hint-placeholder-val="{{false}}"><p class="sub" style="margin-top: 16px">You’re all caught up.</p></sc-if>
<div style="display: flex; flex-direction: column; margin-top: 12px">
<sc-for list="{{pendingAssign}}" as="a" hint-placeholder-count="2">
<div style="padding: 12px 0; border-bottom: 1px solid #EEF1F5">
<div style="font-size: 14px">{{a.title}}</div>
<div class="eyebrow" style="margin-top: 4px">{{a.subject}} · Due {{a.dueFmt}}</div>
</div>
</sc-for>
</div>
</div>
</div>
</div>
</div>
</sc-if>

<!-- Student: Basic Information -->
<sc-if value="{{ss.basic}}" hint-placeholder-val="{{false}}">
<div style="display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; align-items: start">
<div class="card" style="padding: 32px 28px">
<div style="width: 88px; height: 88px; border-radius: 50%; background: #EFF2F6; color: #6B7079; display: grid; place-items: center"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
<div class="serif" style="font-size: 30px; margin-top: 20px">[Student Name]</div>
<div class="muted" style="font-size: 14px; margin-top: 4px">Hall Ticket No. [Roll No.]</div>
<span class="pill" style="background: #EAF5EF; color: #1F6B47; margin-top: 16px">Active · Regular</span>
<div style="display: flex; flex-direction: column; margin-top: 24px; border-top: 1px solid #EEF1F5">
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF1F5; font-size: 14px"><span class="muted">Branch</span><span>CSE</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF1F5; font-size: 14px"><span class="muted">Section</span><span>A</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #EEF1F5; font-size: 14px"><span class="muted">Year / Semester</span><span>II / I</span></div>
<div style="display: flex; justify-content: space-between; padding: 12px 0; font-size: 14px"><span class="muted">Batch</span><span>2025–29</span></div>
</div>
</div>
<div class="card">
<div style="padding: 28px">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 class="h2">Personal details</h2><button type="button" class="btn" onClick="{{requestCorrection}}">Request correction</button></div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 32px; margin-top: 24px">
<sc-for list="{{personal}}" as="f" hint-placeholder-count="9">
<div><div class="eyebrow">{{f.k}}</div><div style="font-size: 15px; margin-top: 6px">{{f.v}}</div></div>
</sc-for>
</div>
</div>
<div style="padding: 28px; border-top: 1px solid #EEF1F5">
<h2 class="h2">Admission and academics</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 32px; margin-top: 24px">
<sc-for list="{{admission}}" as="f" hint-placeholder-count="6">
<div><div class="eyebrow">{{f.k}}</div><div style="font-size: 15px; margin-top: 6px">{{f.v}}</div></div>
</sc-for>
</div>
</div>
<div style="padding: 28px; border-top: 1px solid #EEF1F5">
<h2 class="h2">Parent / guardian</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px 32px; margin-top: 24px">
<sc-for list="{{guardian}}" as="f" hint-placeholder-count="3">
<div><div class="eyebrow">{{f.k}}</div><div style="font-size: 15px; margin-top: 6px">{{f.v}}</div></div>
</sc-for>
</div>
</div>
</div>
</div>
</sc-if>

<!-- Student: Academic Information -->
<sc-if value="{{ss.academic}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 32px">
<div role="tablist" aria-label="Academic information" class="tabs">
<button type="button" role="tab" class="tab" onClick="{{at.attendance.go}}" style="color: {{at.attendance.fg}}; border-bottom-color: {{at.attendance.bd}}">Attendance</button>
<button type="button" role="tab" class="tab" onClick="{{at.timetable.go}}" style="color: {{at.timetable.fg}}; border-bottom-color: {{at.timetable.bd}}">Class timetable</button>
<button type="button" role="tab" class="tab" onClick="{{at.assignments.go}}" style="color: {{at.assignments.fg}}; border-bottom-color: {{at.assignments.bd}}">Assignments</button>
<button type="button" role="tab" class="tab" onClick="{{at.syllabus.go}}" style="color: {{at.syllabus.fg}}; border-bottom-color: {{at.syllabus.bd}}">Syllabus progress</button>
</div>

<sc-if value="{{af.attendance}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: start">
<div class="card" style="overflow: hidden">
<div style="padding: 24px 28px 20px"><h2 class="h2">Subject-wise attendance</h2><p class="sub">Updated as soon as your faculty submits attendance</p></div>
<div class="th" style="display: grid; grid-template-columns: minmax(0, 1fr) 64px 72px 200px"><div>Subject</div><div>Held</div><div>Attended</div><div>Percentage</div></div>
<sc-for list="{{attendance}}" as="r" hint-placeholder-count="8">
<div class="tr" style="display: grid; grid-template-columns: minmax(0, 1fr) 64px 72px 200px; align-items: center">
<div>{{r.name}}</div>
<div class="muted">{{r.held}}</div>
<div class="muted">{{r.att}}</div>
<div style="display: flex; align-items: center; gap: 12px">

</div>
</div>

<div style="display: flex; flex-direction: column; gap: 32px">
<div class="card" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="padding: 24px 28px"><div class="eyebrow">Casual leave left</div><div class="num">{{clLeft}} <span class="muted" style="font-size: 14px">of 12 days</span></div></div>
<div style="padding: 24px 28px; border-left: 1px solid #EEF1F5"><div class="eyebrow">Medical leave left</div><div class="num">10 <span class="muted" style="font-size: 14px">of 10 days</span></div></div>
<div style="padding: 24px 28px; border-left: 1px solid #EEF1F5"><div class="eyebrow">On duty this year</div><div class="num">1 <span class="muted" style="font-size: 14px">day</span></div></div>
</div>
<div style="display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 32px; align-items: start">
<div class="card" style="padding: 28px; display: flex; flex-direction: column; gap: 20px">
<h2 class="h2">Apply for leave</h2>
<div><label class="lbl" for="l-type">Leave type</label><select id="l-type" class="inp" value="{{lType}}" onChange="{{onLType}}"><option>Casual leave</option><option>Medical leave</option><option>On duty</option><option>Emergency leave</option></select></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div><label class="lbl" for="l-from">From</label><input id="l-from" class="inp" type="date" value="{{lFrom}}" onChange="{{onLFrom}}"></div>
<div><label class="lbl" for="l-to">To</label><input id="l-to" class="inp" type="date" value="{{lTo}}" onChange="{{onLTo}}"></div>
</div>
<div><label class="lbl" for="l-reason">Reason</label><textarea id="l-reason" class="inp" value="{{lReason}}" onChange="{{onLReason}}" placeholder="Reason for leave" style="min-height: 96px"></textarea></div>
<button type="button" class="btn btn-p" onClick="{{applyLeave}}">Submit to HOD</button>
</div>
<div class="card" style="overflow: hidden">
<div style="padding: 24px 28px 20px"><h2 class="h2">My leave requests</h2></div>
<div class="th" style="display: grid; grid-template-columns: 140px 200px minmax(0, 1fr) 100px"><div>Type</div><div>Dates</div><div>Reason</div><div>Status</div></div>
<sc-for list="{{leaves}}" as="l" hint-placeholder-count="2">
<div class="tr" style="display: grid; grid-template-columns: 140px 200px minmax(0, 1fr) 100px; align-items: center">
<div style="font-weight: 500">{{l.type}}</div><div class="muted">{{l.range}}</div><div class="muted">{{l.reason}}</div>
<div><span class="pill" style="background: {{l.pillBg}}; color: {{l.pillFg}}">{{l.status}}</span></div>
</div>
</sc-for>
</div>
</div>
</div>
</sc-if>

</main>
</div>
</div>
</sc-if>

<!-- Toast -->
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="position: absolute; left: 50%; bottom: 32px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-radius: 10px; background: #0D2D52; color: #FFFFFF; font-size: 14px; box-shadow: 0 8px 24px rgba(21,23,28,.18); max-width: 720px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9FD8BA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>{{toast}}
</div>
</sc-if>

</div>
</template>
<script src="app.js"></script>
</body>
</html>
